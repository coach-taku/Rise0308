<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>RISE NOTE - オフライン</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .icon-wrapper {
      margin-bottom: 32px;
    }

    .icon-wrapper img {
      width: 96px;
      height: 96px;
      border-radius: 20px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      color: #f97316;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 40px;
    }

    .message-card {
      background-color: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 360px;
      width: 100%;
      margin-bottom: 32px;
    }

    .offline-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .message-title {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .message-text {
      font-size: 14px;
      color: #9ca3af;
      line-height: 1.7;
    }

    .retry-button {
      background-color: #f97316;
      color: #000000;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }

    .retry-button:active {
      opacity: 0.8;
    }

    .quote {
      margin-top: 48px;
      font-size: 12px;
      color: #374151;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="icon-wrapper">
    <img src="/icons/icon-192x192.png" alt="RISE NOTE" />
  </div>

  <div class="title">RISE NOTE</div>
  <div class="subtitle">KUKI GYMRATS</div>

  <div class="message-card">
    <div class="offline-icon">📡</div>
    <div class="message-title">オフラインです</div>
    <div class="message-text">
      現在、インターネットに接続されていません。<br />
      Wi-Fi またはモバイルデータ通信を確認してから、もう一度お試しください。
    </div>
  </div>

  <button class="retry-button" onclick="window.location.reload()">
    再読み込み
  </button>

  <div class="quote">本気になれば、何者にもなれる</div>

  <script>
    // オンラインに復帰したら自動でリロード
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
